<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151525">
    <title>Sleepy Monster Machine</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: radial-gradient(circle at top, #45436a, #171725 70%);
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }

        main {
            width: min(100%, 620px);
            padding: 36px 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            background: rgba(20, 20, 38, 0.78);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 7vw, 3rem);
        }

        .monster {
            position: relative;
            width: 190px;
            height: 180px;
            margin: 42px auto 28px;
            padding: 0;
            border: 5px solid #24243b;
            border-radius: 48% 48% 42% 42%;
            background: #a98ae8;
            box-shadow: inset -14px -12px 0 #8769c6, 0 16px 30px #090912;
            cursor: pointer;
            font: inherit;
            transition: transform 350ms ease, background-color 350ms ease;
        }

        .monster:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 7px;
        }

        .monster::before,
        .monster::after {
            position: absolute;
            top: -24px;
            width: 52px;
            height: 52px;
            content: "";
            border: 5px solid #24243b;
            border-radius: 50% 50% 0 50%;
            background: #a98ae8;
            z-index: -1;
        }

        .monster::before {
            left: 12px;
            transform: rotate(-28deg);
        }

        .monster::after {
            right: 12px;
            transform: rotate(28deg) scaleX(-1);
        }

        .eyes {
            display: flex;
            justify-content: center;
            gap: 34px;
            padding-top: 55px;
        }

        .eye {
            width: 24px;
            height: 28px;
            border-radius: 50%;
            background: #fff;
            box-shadow: inset 0 -5px 0 #d9d5ea;
        }

        .eye::after {
            display: block;
            width: 9px;
            height: 12px;
            margin: 8px auto 0;
            border-radius: 50%;
            background: #24243b;
            content: "";
        }

        .mouth {
            width: 48px;
            height: 15px;
            margin: 22px auto 0;
            border-radius: 0 0 30px 30px;
            background: #4c2e61;
        }

        .zzz {
            position: absolute;
            top: -58px;
            right: -42px;
            color: #fff;
            font-size: 2rem;
            font-weight: 800;
            animation: float 1.3s ease-in-out infinite alternate;
        }

        .status {
            min-height: 2.5em;
            margin: 0;
            font-size: clamp(1.1rem, 4vw, 1.4rem);
        }

        .sound-button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 2px solid #c8b7ff;
            border-radius: 999px;
            background: #312b4b;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .sound-button:hover,
        .sound-button:focus-visible {
            background: #4b3d70;
        }

        .home-link {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 20px;
            border: 2px solid #c8b7ff;
            border-radius: 999px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        .home-link:hover,
        .home-link:focus-visible {
            background: #4b3d70;
        }

        .awake .monster {
            transform: scale(1.08) rotate(-3deg);
            background: #ff795f;
            animation: shake 180ms ease-in-out 5;
        }

        .awake .monster::before,
        .awake .monster::after {
            background: #ff795f;
        }

        .awake .eye {
            height: 20px;
            margin-top: 4px;
            border-radius: 50% 50% 4px 4px;
        }

        .awake .eye::after {
            display: none;
        }

        .awake .mouth {
            width: 66px;
            height: 40px;
            margin-top: 14px;
            border: 4px solid #4c2e61;
            border-radius: 45%;
            background: #331e3c;
        }

        .awake .zzz {
            display: none;
        }

        @keyframes float {
            to { transform: translate(8px, -12px) scale(0.85); }
        }

        @keyframes shake {
            25% { transform: scale(1.08) rotate(4deg); }
            75% { transform: scale(1.08) rotate(-5deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main id="machine">
        <h1>Sleepy Monster Machine</h1>
        <button class="monster" id="monster" type="button" aria-label="Wake the monster">
            <span class="zzz">Zzz...</span>
            <div class="eyes"><span class="eye"></span><span class="eye"></span></div>
            <div class="mouth"></div>
        </button>
        <p class="status" id="status" aria-live="assertive">Shhh... The monster is fast asleep.</p>
        <p id="hint">Click the monster to wake it up.</p>
        <button class="sound-button" id="sound-button" type="button" hidden>Play Kiki's voice</button>
        <audio id="monster-voice" src="kiki.mp3" preload="none"></audio>
        <a class="home-link" href="index.html">Back to Home</a>
    </main>
    <script>
        const machine = document.getElementById("machine");
        const monster = document.getElementById("monster");
        const status = document.getElementById("status");
        const hint = document.getElementById("hint");
        const soundButton = document.getElementById("sound-button");
        const voice = document.getElementById("monster-voice");
        const autoReturn = new URLSearchParams(window.location.search).get("mode") !== "stay";
        let playbackRequested = false;
        let returnTimer;

        async function playKikiVoice() {
            playbackRequested = true;
            machine.classList.add("awake");
            status.textContent = "WHAT?! YOU WOKE ME UP! GET OUT! NOW!";
            hint.textContent = "Click again to hear Kiki's voice again.";
            soundButton.hidden = true;
            try {
                voice.currentTime = 0;
                await voice.play();
            } catch (error) {
                if (!autoReturn) {
                    machine.classList.remove("awake");
                }
                status.textContent = "Kiki's audio could not play. Check that kiki.mp3 is a supported audio file.";
                hint.textContent = "Use the button below to try the audio again.";
                soundButton.hidden = false;
            }
        }

        function resetMonster() {
            if (autoReturn) return;
            machine.classList.remove("awake");
            status.textContent = "Shhh... The monster is fast asleep.";
            hint.textContent = "Click the monster to wake it up.";
        }

        monster.addEventListener("click", playKikiVoice);
        soundButton.addEventListener("click", playKikiVoice);
        voice.addEventListener("ended", resetMonster);
        voice.addEventListener("error", () => {
            if (playbackRequested) {
                status.textContent = "Kiki's audio could not be loaded. Check that kiki.mp3 is a supported audio file.";
                soundButton.hidden = false;
            }
        });
        voice.addEventListener("loadedmetadata", () => {
            if (autoReturn && Number.isFinite(voice.duration)) {
                window.clearTimeout(returnTimer);
                returnTimer = window.setTimeout(() => {
                    window.location.replace("lecker1.html");
                }, voice.duration * 1000 + 1200);
            }
        });
        voice.addEventListener("ended", () => {
            if (autoReturn) {
                window.clearTimeout(returnTimer);
                returnTimer = window.setTimeout(() => {
                    window.location.replace("lecker1.html");
                }, 1200);
            }
        });

        if (autoReturn) {
            window.addEventListener("load", async () => {
                returnTimer = window.setTimeout(() => {
                    window.location.replace("lecker1.html");
                }, 12000);
                try {
                    await playKikiVoice();
                } catch (error) {
                    window.clearTimeout(returnTimer);
                    returnTimer = window.setTimeout(() => {
                        window.location.replace("lecker1.html");
                    }, 8000);
                }
            }, { once: true });
        }
    </script>
</body>
</html>
